name: Reportar un fallo / Bug report
description: Algo no funciona / Something does not work
labels: ["bug"]
body:
  - type: input
    id: distro
    attributes:
      label: Distro, GPU y driver / Distro, GPU and driver
      placeholder: "Fedora 43, RX 9060 XT, Mesa 25.x"
    validations:
      required: true
  - type: input
    id: ver
    attributes:
      label: Versión del mod y de Minecraft / Mod and Minecraft version
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Qué ocurre y cómo reproducirlo / What happens and how to reproduce
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log (latest.log)
